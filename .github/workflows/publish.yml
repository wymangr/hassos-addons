name: Publish add-on images

# Builds and pushes an add-on image to GHCR only when that add-on's config.yaml
# version is bumped. Routine changes to main that do not change a version build
# nothing, and only the add-on(s) whose version changed are built - not every
# add-on in the repo.
#
# NOTE: the version check in detect_publish.py is the real gate on whether an
# image is built. The paths filter limits runs to commits that touch a
# config.yaml (where the version lives); the detect job then no-ops (builds
# nothing) unless an add-on's version actually changed.
on:
  push:
    branches:
      - main
    paths:
      - "*/config.yaml"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on to force publish (dir name or slug). Leave blank to publish ALL add-ons."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bumps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history so the previous commit's config.yaml can be read.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Detect changed add-on versions
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCE_ADDON: ${{ github.event.inputs.addon }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.addon == '' }}
          OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/detect_publish.py

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }}) ${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.addon }}
          platforms: ${{ matrix.platform }}
          push: true
          # Single-arch images per HA add-on convention; provenance/SBOM
          # manifests can confuse the Supervisor's pull, so disable them.
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.image }}:${{ matrix.version }}
            ${{ matrix.image }}:latest
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ matrix.version }}
